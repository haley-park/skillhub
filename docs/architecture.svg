<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1000" height="520" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="500" y="44" font-size="18" font-weight="700" fill="#191F28" text-anchor="middle">Skillhub — 시스템 아키텍처</text>

  <!-- ── User ── -->
  <rect x="42" y="200" width="120" height="80" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="102" y="234" font-size="28" text-anchor="middle">👤</text>
  <text x="102" y="260" font-size="13" font-weight="600" fill="#191F28" text-anchor="middle">사용자</text>
  <text x="102" y="276" font-size="11" fill="#8B95A1" text-anchor="middle">브라우저</text>

  <!-- arrow user -> frontend -->
  <line x1="164" y1="240" x2="226" y2="240" stroke="#3182F6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="226,235 236,240 226,245" fill="#3182F6"/>
  <text x="195" y="232" font-size="10" fill="#3182F6" text-anchor="middle">localhost:3000</text>

  <!-- ── Frontend ── -->
  <rect x="238" y="170" width="160" height="140" rx="16" fill="#EBF3FE" stroke="#3182F6" stroke-width="1.5"/>
  <text x="318" y="210" font-size="26" text-anchor="middle">⚛️</text>
  <text x="318" y="238" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">Next.js 15</text>
  <text x="318" y="257" font-size="11" fill="#4E5968" text-anchor="middle">App Router · RSC</text>
  <text x="318" y="274" font-size="11" fill="#4E5968" text-anchor="middle">Framer Motion</text>
  <text x="318" y="291" font-size="11" fill="#4E5968" text-anchor="middle">Tailwind CSS</text>

  <!-- arrow frontend -> backend -->
  <line x1="400" y1="240" x2="462" y2="240" stroke="#3182F6" stroke-width="1.5"/>
  <polygon points="462,235 472,240 462,245" fill="#3182F6"/>
  <text x="431" y="232" font-size="10" fill="#3182F6" text-anchor="middle">REST API</text>
  <text x="431" y="253" font-size="10" fill="#3182F6" text-anchor="middle">polling 5s</text>

  <!-- ── Backend ── -->
  <rect x="474" y="150" width="180" height="180" rx="16" fill="#F0FDF8" stroke="#00C896" stroke-width="1.5"/>
  <text x="564" y="192" font-size="26" text-anchor="middle">🐍</text>
  <text x="564" y="220" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">FastAPI 0.115</text>
  <text x="564" y="240" font-size="11" fill="#4E5968" text-anchor="middle">Python 3.11+</text>
  <text x="564" y="258" font-size="11" fill="#4E5968" text-anchor="middle">SQLAlchemy 2.0</text>
  <text x="564" y="276" font-size="11" fill="#4E5968" text-anchor="middle">Pydantic v2</text>
  <text x="564" y="294" font-size="11" fill="#4E5968" text-anchor="middle">Watchdog</text>
  <text x="564" y="312" font-size="11" fill="#8B95A1" text-anchor="middle">:8000</text>

  <!-- arrow backend -> postgres -->
  <line x1="564" y1="332" x2="564" y2="388" stroke="#8B95A1" stroke-width="1.5"/>
  <polygon points="559,388 564,398 569,388" fill="#8B95A1"/>

  <!-- ── PostgreSQL ── -->
  <rect x="474" y="400" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="564" y="432" font-size="22" text-anchor="middle">🐘</text>
  <text x="564" y="458" font-size="13" font-weight="600" fill="#191F28" text-anchor="middle">PostgreSQL 16</text>
  <text x="564" y="472" font-size="11" fill="#8B95A1" text-anchor="middle">docker-compose</text>

  <!-- arrow backend -> anthropic -->
  <line x1="656" y1="240" x2="718" y2="240" stroke="#FFB400" stroke-width="1.5"/>
  <polygon points="718,235 728,240 718,245" fill="#FFB400"/>
  <text x="687" y="232" font-size="10" fill="#B07800" text-anchor="middle">trigger test</text>

  <!-- ── Anthropic ── -->
  <rect x="730" y="180" width="200" height="120" rx="16" fill="#FFFBF0" stroke="#FFB400" stroke-width="1.5"/>
  <text x="830" y="222" font-size="26" text-anchor="middle">🤖</text>
  <text x="830" y="250" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">Anthropic API</text>
  <text x="830" y="270" font-size="11" fill="#4E5968" text-anchor="middle">claude-sonnet-4-6</text>
  <text x="830" y="288" font-size="11" fill="#8B95A1" text-anchor="middle">트리거 판단</text>

  <!-- ── Skills Dir ── -->
  <rect x="730" y="370" width="200" height="100" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="830" y="408" font-size="22" text-anchor="middle">📁</text>
  <text x="830" y="434" font-size="13" font-weight="600" fill="#191F28" text-anchor="middle">~/skillhub/skills/</text>
  <text x="830" y="452" font-size="11" fill="#4E5968" text-anchor="middle">SKILL.md 파일들</text>
  <text x="830" y="466" font-size="11" fill="#8B95A1" text-anchor="middle">파일이 곧 진실</text>

  <!-- arrow skills dir -> backend (watchdog) -->
  <line x1="728" y1="420" x2="660" y2="320" stroke="#00C896" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="656,315 658,328 666,320" fill="#00C896"/>
  <text x="710" y="364" font-size="10" fill="#00C896" text-anchor="middle">watchdog</text>
  <text x="710" y="376" font-size="10" fill="#00C896" text-anchor="middle">자동 감지</text>

  <!-- Legend -->
  <rect x="42" y="440" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
  <line x1="62" y1="462" x2="90" y2="462" stroke="#3182F6" stroke-width="1.5"/>
  <text x="98" y="466" font-size="11" fill="#4E5968">HTTP / REST</text>
  <line x1="62" y1="482" x2="90" y2="482" stroke="#00C896" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="98" y="486" font-size="11" fill="#4E5968">파일 감시 (watchdog)</text>
  <line x1="190" y1="462" x2="218" y2="462" stroke="#FFB400" stroke-width="1.5"/>
  <text x="226" y="466" font-size="11" fill="#4E5968">Anthropic API 호출</text>
  <line x1="190" y1="482" x2="218" y2="482" stroke="#8B95A1" stroke-width="1.5"/>
  <text x="226" y="486" font-size="11" fill="#4E5968">ORM / SQL</text>
</svg>
