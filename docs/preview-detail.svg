  <text x="72" y="366" font-size="22" font-weight="700" fill="#191F28">PDF Extraction Skill</text>
  <rect x="72" y="376" width="600" height="1" fill="#E5E8EB"/>

  <!-- body text -->
  <text x="72" y="402" font-size="14" fill="#4E5968">A skill for extracting text and structured data from PDF files.</text>

