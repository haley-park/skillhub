  <text x="80" y="462" font-size="13" fill="#4E5968">•  Extract text from a PDF file</text>
  <text x="80" y="482" font-size="13" fill="#4E5968">•  Parse table data from PDF</text>
  <text x="80" y="502" font-size="13" fill="#4E5968">•  OCR processing of scanned documents</text>
