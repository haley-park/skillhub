  <text x="96" y="594" font-size="13" font-family="monospace" fill="#A5D6FF">"Extract the tables from this PDF and convert to Excel"</text>
  <text x="96" y="614" font-size="13" font-family="monospace" fill="#A5D6FF">"Summarize the key clauses in this contract PDF"</text>
