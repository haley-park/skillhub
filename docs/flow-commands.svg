<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="360" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="450" y="40" font-size="16" font-weight="700" fill="#191F28" text-anchor="middle">Claude Commands → Skillhub Auto-Sync</text>

  <!-- Step 1: Save file -->
  <rect x="40" y="80" width="180" height="160" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="130" y="120" font-size="28" text-anchor="middle">📝</text>
  <text x="130" y="148" font-size="13" font-weight="700" fill="#191F28" text-anchor="middle">Save skill file</text>
  <text x="130" y="168" font-size="11" fill="#8B95A1" text-anchor="middle">~/.claude/commands/</text>
  <text x="130" y="184" font-size="11" fill="#3182F6" text-anchor="middle">new-skill.md</text>
  <text x="130" y="208" font-size="10" fill="#4E5968" text-anchor="middle">YAML frontmatter</text>
  <text x="130" y="222" font-size="10" fill="#4E5968" text-anchor="middle">+ Markdown body</text>

  <!-- Arrow 1 -->
  <line x1="222" y1="160" x2="278" y2="160" stroke="#00C896" stroke-width="2"/>
  <polygon points="278,155 290,160 278,165" fill="#00C896"/>
  <text x="256" y="150" font-size="10" fill="#00C896" text-anchor="middle">watchdog</text>
  <text x="256" y="176" font-size="10" fill="#8B95A1" text-anchor="middle">&lt; 1s</text>

  <!-- Step 2: Auto-detect -->
  <rect x="292" y="80" width="180" height="160" rx="16" fill="#F0FDF8" stroke="#00C896" stroke-width="1.5"/>
  <text x="382" y="120" font-size="28" text-anchor="middle">⚡</text>
  <text x="382" y="148" font-size="13" font-weight="700" fill="#191F28" text-anchor="middle">Auto-detected</text>
  <text x="382" y="168" font-size="11" fill="#4E5968" text-anchor="middle">Scanner parses</text>
  <text x="382" y="184" font-size="11" fill="#4E5968" text-anchor="middle">frontmatter + body</text>
  <text x="382" y="208" font-size="10" fill="#4E5968" text-anchor="middle">Synced to DB</text>
  <text x="382" y="222" font-size="10" fill="#4E5968" text-anchor="middle">in real-time</text>

  <!-- Arrow 2 -->
  <line x1="474" y1="160" x2="530" y2="160" stroke="#3182F6" stroke-width="2"/>
  <polygon points="530,155 542,160 530,165" fill="#3182F6"/>
  <text x="508" y="150" font-size="10" fill="#3182F6" text-anchor="middle">instant</text>

  <!-- Step 3: Skillhub card -->
  <rect x="544" y="80" width="180" height="160" rx="16" fill="#EBF3FE" stroke="#3182F6" stroke-width="1.5"/>
  <text x="634" y="120" font-size="28" text-anchor="middle">🧠</text>
  <text x="634" y="148" font-size="13" font-weight="700" fill="#191F28" text-anchor="middle">Skillhub UI</text>
  <text x="634" y="168" font-size="11" fill="#4E5968" text-anchor="middle">Card appears in</text>
  <text x="634" y="184" font-size="11" fill="#4E5968" text-anchor="middle">skill library</text>
  <text x="634" y="208" font-size="10" fill="#4E5968" text-anchor="middle">Search · Filter</text>
  <text x="634" y="222" font-size="10" fill="#4E5968" text-anchor="middle">Trigger Test · Open</text>

  <!-- Arrow down from step 1 -->
  <line x1="130" y1="242" x2="130" y2="286" stroke="#8B95A1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="125,286 130,298 135,286" fill="#8B95A1"/>

  <!-- Claude Code box -->
  <rect x="40" y="300" width="180" height="44" rx="12" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="130" y="327" font-size="13" fill="#191F28" text-anchor="middle">Claude Code  <tspan font-weight="700" fill="#3182F6">/new-skill</tspan></text>

  <!-- dashed arrow from Claude Code label area to Skillhub -->
  <line x1="222" y1="322" x2="634" y2="242" stroke="#8B95A1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="440" y="300" font-size="10" fill="#8B95A1" text-anchor="middle">same file, dual purpose</text>

  <!-- bottom label -->
  <text x="450" y="348" font-size="11" fill="#B0B8C1" text-anchor="middle">One .md file — usable as both a Claude Code command and a Skillhub skill card</text>
</svg>
