<svg width="1100" height="560" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1100" height="560" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="550" y="44" font-size="18" font-weight="700" fill="#191F28" text-anchor="middle">Skillhub — System Architecture</text>

  <!-- User -->
  <rect x="42" y="210" width="120" height="80" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="102" y="244" font-size="28" text-anchor="middle">👤</text>
  <text x="102" y="268" font-size="13" font-weight="600" fill="#191F28" text-anchor="middle">User</text>
  <text x="102" y="284" font-size="11" fill="#8B95A1" text-anchor="middle">Browser</text>

  <!-- arrow user -> frontend -->
  <line x1="164" y1="250" x2="226" y2="250" stroke="#3182F6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="226,245 236,250 226,255" fill="#3182F6"/>
  <text x="195" y="242" font-size="10" fill="#3182F6" text-anchor="middle">localhost:3000</text>

  <!-- Frontend -->
  <rect x="238" y="180" width="160" height="140" rx="16" fill="#EBF3FE" stroke="#3182F6" stroke-width="1.5"/>
  <text x="318" y="220" font-size="26" text-anchor="middle">⚛️</text>
  <text x="318" y="248" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">Next.js 15</text>
  <text x="318" y="267" font-size="11" fill="#4E5968" text-anchor="middle">App Router</text>
  <text x="318" y="284" font-size="11" fill="#4E5968" text-anchor="middle">Framer Motion</text>
  <text x="318" y="301" font-size="11" fill="#4E5968" text-anchor="middle">Tailwind CSS</text>

  <!-- arrow frontend -> backend -->
  <line x1="400" y1="250" x2="462" y2="250" stroke="#3182F6" stroke-width="1.5"/>
  <polygon points="462,245 472,250 462,255" fill="#3182F6"/>
  <text x="431" y="242" font-size="10" fill="#3182F6" text-anchor="middle">REST API</text>
  <text x="431" y="263" font-size="10" fill="#3182F6" text-anchor="middle">5s polling</text>

  <!-- Backend -->
  <rect x="474" y="160" width="180" height="180" rx="16" fill="#F0FDF8" stroke="#00C896" stroke-width="1.5"/>
  <text x="564" y="200" font-size="26" text-anchor="middle">🐍</text>
  <text x="564" y="228" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">FastAPI 0.115</text>
  <text x="564" y="248" font-size="11" fill="#4E5968" text-anchor="middle">Python 3.11+</text>
  <text x="564" y="266" font-size="11" fill="#4E5968" text-anchor="middle">SQLAlchemy 2.0</text>
  <text x="564" y="284" font-size="11" fill="#4E5968" text-anchor="middle">Pydantic v2</text>
  <text x="564" y="302" font-size="11" fill="#4E5968" text-anchor="middle">Watchdog</text>
  <text x="564" y="322" font-size="11" fill="#8B95A1" text-anchor="middle">:8000</text>

  <!-- arrow backend -> postgres -->
  <line x1="564" y1="342" x2="564" y2="398" stroke="#8B95A1" stroke-width="1.5"/>
  <polygon points="559,398 564,408 569,398" fill="#8B95A1"/>

  <!-- PostgreSQL -->
  <rect x="474" y="410" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="564" y="442" font-size="22" text-anchor="middle">🐘</text>
  <text x="564" y="468" font-size="13" font-weight="600" fill="#191F28" text-anchor="middle">PostgreSQL</text>
  <text x="564" y="482" font-size="11" fill="#8B95A1" text-anchor="middle">metadata index</text>

  <!-- arrow backend -> anthropic -->
  <line x1="656" y1="250" x2="718" y2="250" stroke="#FFB400" stroke-width="1.5"/>
  <polygon points="718,245 728,250 718,255" fill="#FFB400"/>
  <text x="687" y="242" font-size="10" fill="#B07800" text-anchor="middle">trigger test</text>

  <!-- Anthropic -->
  <rect x="730" y="190" width="200" height="120" rx="16" fill="#FFFBF0" stroke="#FFB400" stroke-width="1.5"/>
  <text x="830" y="232" font-size="26" text-anchor="middle">🤖</text>
  <text x="830" y="260" font-size="14" font-weight="700" fill="#191F28" text-anchor="middle">Anthropic API</text>
  <text x="830" y="280" font-size="11" fill="#4E5968" text-anchor="middle">claude-sonnet-4-6</text>
  <text x="830" y="298" font-size="11" fill="#8B95A1" text-anchor="middle">trigger detection</text>

  <!-- Skills Dir box -->
  <rect x="710" y="370" width="240" height="110" rx="16" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1.5"/>
  <text x="830" y="400" font-size="20" text-anchor="middle">📁</text>
  <text x="830" y="424" font-size="12" font-weight="600" fill="#191F28" text-anchor="middle">~/skillhub/skills/</text>
  <text x="830" y="442" font-size="11" fill="#8B95A1" text-anchor="middle">+ ~/.claude/commands/</text>
  <text x="830" y="460" font-size="11" fill="#4E5968" text-anchor="middle">SKILL.md · *.md files</text>
  <text x="830" y="474" font-size="10" fill="#00C896" text-anchor="middle">file is source of truth</text>

  <!-- arrow skills dir -> backend (watchdog) -->
  <line x1="710" y1="425" x2="660" y2="330" stroke="#00C896" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="656,325 659,338 667,330" fill="#00C896"/>
  <text x="698" y="374" font-size="10" fill="#00C896" text-anchor="middle">watchdog</text>
  <text x="698" y="386" font-size="10" fill="#00C896" text-anchor="middle">auto-detect</text>

  <!-- Legend -->
  <rect x="42" y="460" width="380" height="58" rx="12" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
  <line x1="62" y1="482" x2="90" y2="482" stroke="#3182F6" stroke-width="1.5"/>
  <text x="98" y="486" font-size="11" fill="#4E5968">HTTP / REST</text>
  <line x1="62" y1="502" x2="90" y2="502" stroke="#00C896" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="98" y="506" font-size="11" fill="#4E5968">File watching (watchdog)</text>
  <line x1="200" y1="482" x2="228" y2="482" stroke="#FFB400" stroke-width="1.5"/>
  <text x="236" y="486" font-size="11" fill="#4E5968">Anthropic API</text>
  <line x1="200" y1="502" x2="228" y2="502" stroke="#8B95A1" stroke-width="1.5"/>
  <text x="236" y="506" font-size="11" fill="#4E5968">ORM / SQL</text>
</svg>
